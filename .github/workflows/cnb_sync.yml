name: Sync to CNB

on:
  push:
    branches:
      - main
      - cursor/cnb-07b0
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get repository name
        id: repo-name
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          echo "name=$REPO_NAME" >> "$GITHUB_OUTPUT"

      - name: Verify CNB token exists
        run: |
          if [ -z "${{ secrets.CNB_TOKEN }}" ]; then
            echo "CNB_TOKEN is not configured in repository secrets."
            exit 1
          fi

      - name: Sync to CNB repository
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:${{ github.workspace }} \
            -w ${{ github.workspace }} \
            -e PLUGIN_TARGET_URL="https://cnb.cool/${{ github.repository_owner }}/${{ steps.repo-name.outputs.name }}.git" \
            -e PLUGIN_AUTH_TYPE="https" \
            -e PLUGIN_USERNAME="cnb" \
            -e PLUGIN_PASSWORD=${{ secrets.CNB_TOKEN }} \
            -e PLUGIN_FORCE="true" \
            tencentcom/git-sync
